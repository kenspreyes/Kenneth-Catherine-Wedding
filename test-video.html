<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Film — Playback Test</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#263328;color:#f5f0e6;font:15px/1.6 Arial,sans-serif}main{width:min(960px,94vw);padding:20px;text-align:center}video{display:block;width:100%;max-height:65vh;background:#111;object-fit:contain;border-radius:14px}#status{min-height:3em}a{color:#e6d6b9}</style>
</head><body><main><h1>Wedding Film Playback Test</h1><p>This page plays the exact MP4 included with your website.</p>
<video id="film" controls autoplay muted playsinline preload="metadata" poster="assets/images/video-poster.jpg">
<source src="assets/videos/wedding-film.mp4" type="video/mp4">Your browser does not support HTML5 video.</video>
<p id="status" role="status">Checking the video…</p><a href="index.html">Return to wedding website</a></main>
<script>
const v=document.getElementById('film'),s=document.getElementById('status');
v.addEventListener('loadedmetadata',()=>s.textContent='Video found. '+Math.round(v.duration)+' seconds · '+v.videoWidth+' × '+v.videoHeight+'.');
v.addEventListener('playing',()=>s.textContent='Video playing successfully.');
v.addEventListener('error',()=>s.textContent='Video failed to load or decode. Check assets/videos/wedding-film.mp4 and try Microsoft Edge or Chrome.');
v.play().catch(()=>s.textContent='Video found, but autoplay was blocked. Press the Play button above.');
</script></body></html>
